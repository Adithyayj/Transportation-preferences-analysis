[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "transportation-preferences-analysis"
version = "0.1.0"
description = "Survey analysis and exploratory modeling of student transportation preferences"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "joblib>=1.3",
]

[tool.setuptools.packages.find]
where = ["src"]
