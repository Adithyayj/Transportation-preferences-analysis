name: Transportation survey analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -v

      - name: Run the complete analysis pipeline
        run: python run_project.py

      - name: Check Python syntax
        run: python -m compileall -q src run_project.py

      - name: Save analysis outputs
        uses: actions/upload-artifact@v4
        with:
          name: transportation-analysis-outputs
          path: |
            outputs/charts/*.png
            outputs/*.csv
            outputs/*.txt
            outputs/*.joblib
            data/cleaned_data.csv
          if-no-files-found: error
          retention-days: 14
